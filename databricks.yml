bundle:
  name: llmops-databricks-course-MartijnCauchy

include:
  - resources/*.yml

variables:
  git_sha:
    description: "Git SHA of the deployed commit"
    default: "local"
  budget_policy_id:
    description: "Serverless usage policy ID"
    default: "76243905-4928-49b4-97c8-01ebd95b58ad"

artifacts:
  default:
    type: whl
    build: uv build
    path: .

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-262e5c90-b29a.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
