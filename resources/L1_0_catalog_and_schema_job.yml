resources:
  jobs:
    L1_0_catalog_and_schema_job:
      name: L1-0-catalog-and-schema
      budget_policy_id: ${var.budget_policy_id}
      tags:
        project_name: "llmops-databricks-course-MartijnCauchy"

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: run_notebook
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/L1_0_catalog_and_schema.py
            base_parameters:
              env: ${bundle.target}
              git_sha: "${var.git_sha}"
              run_id: "{{job.run_id}}"
