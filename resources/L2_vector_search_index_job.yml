resources:
  jobs:
    L2_vector_search_index_job:
      name: L2-vector-search-index
      tags:
        project_name: "llmops-databricks-course-MartijnCauchy"

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: run_notebook
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/L2_vector_search_index.py
            base_parameters:
              env: ${bundle.target}
              git_sha: "${var.git_sha}"
              run_id: "{{job.run_id}}"
